<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimizador de Contenido E-commerce</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.875rem;
      color: #666;
      margin-top: 0.25rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
    }

    .card h2 {
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #555;
      margin-bottom: 1.25rem;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    select, textarea {
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      font-size: 0.9rem;
      font-family: inherit;
      color: #1a1a2e;
      transition: border-color 0.15s;
      width: 100%;
      background: #fafafa;
    }

    select:focus, textarea:focus {
      outline: none;
      border-color: #4f6ef7;
      background: #fff;
    }

    select { height: 42px; }

    textarea {
      resize: vertical;
      min-height: 130px;
      line-height: 1.5;
    }

    .full { grid-column: 1 / -1; }

    button#generate-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.9rem;
      background: #4f6ef7;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button#generate-btn:hover { background: #3a58d4; }
    button#generate-btn:active { transform: scale(0.99); }
    button#generate-btn:disabled { background: #a0aec0; cursor: not-allowed; }

    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #result-section { display: none; }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .result-block {
      background: #f7f8fc;
      border-radius: 8px;
      padding: 1rem 1.1rem;
    }

    .result-block.full { grid-column: 1 / -1; }

    .result-block h3 {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #888;
      margin-bottom: 0.5rem;
    }

    .result-block p, .result-block ul {
      font-size: 0.88rem;
      color: #222;
      line-height: 1.55;
    }

    .result-block ul { padding-left: 1.1rem; }
    .result-block ul li { margin-bottom: 0.4rem; }

    .char-badge {
      display: inline-block;
      background: #e8edf9;
      color: #4f6ef7;
      border-radius: 20px;
      padding: 0.1rem 0.55rem;
      font-size: 0.72rem;
      font-weight: 700;
      margin-left: 0.4rem;
    }

    .kw-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.25rem;
    }

    .kw-tag {
      background: #e8edf9;
      color: #3a58d4;
      border-radius: 20px;
      padding: 0.15rem 0.6rem;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .error-box {
      background: #fff5f5;
      border: 1.5px solid #fc8181;
      border-radius: 8px;
      padding: 1rem;
      color: #c53030;
      font-size: 0.88rem;
      display: none;
    }

    .raw-btn {
      font-size: 0.78rem;
      color: #4f6ef7;
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 0.75rem;
      display: inline-block;
    }

    pre#raw-json {
      background: #1e1e2e;
      color: #cdd6f4;
      border-radius: 8px;
      padding: 1rem;
      font-size: 0.8rem;
      overflow: auto;
      margin-top: 0.5rem;
      display: none;
      white-space: pre-wrap;
    }

    @media (max-width: 600px) {
      .row, .result-grid { grid-template-columns: 1fr; }
      .full { grid-column: 1; }
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>Optimizador de Contenido E-commerce</h1>
    <p>Generador de títulos, bullets y descripciones para retailers mexicanos.</p>
  </header>

  <div class="card">
    <h2>Configuración</h2>
    <div class="row">
      <div class="field">
        <label for="brand">Marca</label>
        <select id="brand">
          <option value="">— Selecciona —</option>
          <option value="Regio">Regio</option>
          <option value="Saba">Saba</option>
          <option value="Tena">Tena</option>
        </select>
      </div>
      <div class="field">
        <label for="retailer">Retailer</label>
        <select id="retailer">
          <option value="">— Selecciona —</option>
          <option value="Walmart">Walmart</option>
          <option value="Amazon">Amazon</option>
          <option value="Chedraui">Chedraui</option>
        </select>
      </div>
      <div class="field full">
        <label for="generic-text">Texto Genérico del Producto</label>
        <textarea id="generic-text" placeholder="Pega aquí la descripción genérica del producto..."></textarea>
      </div>
      <div class="field full">
        <label for="keywords">Keywords Disponibles</label>
        <textarea id="keywords" placeholder="Pega aquí los keywords separados por coma o salto de línea..." style="min-height:90px;"></textarea>
      </div>
    </div>

    <div style="margin-top:1.25rem;">
      <div id="error-box" class="error-box"></div>
      <button id="generate-btn" onclick="generate()">
        <div class="spinner" id="spinner"></div>
        <span id="btn-label">Generar Contenido Optimizado</span>
      </button>
    </div>
  </div>

  <div id="result-section">
    <div class="card">
      <h2>Resultado</h2>
      <div class="result-grid">

        <div class="result-block full">
          <h3>Título Optimizado <span class="char-badge" id="char-titulo"></span></h3>
          <p id="titulo"></p>
        </div>

        <div class="result-block full">
          <h3>Bullet Points</h3>
          <ul id="bullets"></ul>
        </div>

        <div class="result-block full">
          <h3>Descripción Optimizada <span class="char-badge" id="char-desc"></span></h3>
          <p id="descripcion" style="white-space:pre-wrap;"></p>
        </div>

        <div class="result-block full">
          <h3>Keywords Integradas</h3>
          <div class="kw-list" id="keywords-out"></div>
        </div>

      </div>

      <button class="raw-btn" onclick="toggleRaw()">Ver / ocultar JSON crudo</button>
      <pre id="raw-json"></pre>
    </div>
  </div>

</div>

<script>
  async function generate() {
    const brand = document.getElementById("brand").value;
    const retailer = document.getElementById("retailer").value;
    const generic_text = document.getElementById("generic-text").value.trim();
    const keywords = document.getElementById("keywords").value.trim();

    const errBox = document.getElementById("error-box");
    errBox.style.display = "none";

    if (!brand || !retailer || !generic_text || !keywords) {
      errBox.textContent = "Completa todos los campos antes de continuar.";
      errBox.style.display = "block";
      return;
    }

    setLoading(true);

    try {
      const res = await fetch("/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ brand, retailer, generic_text, keywords }),
      });
      const data = await res.json();

      if (!res.ok || !data.success) {
        errBox.textContent = data.error || "Error desconocido.";
        errBox.style.display = "block";
        document.getElementById("result-section").style.display = "none";
        return;
      }

      renderResult(data.result);
    } catch (e) {
      errBox.textContent = "Error de conexión: " + e.message;
      errBox.style.display = "block";
    } finally {
      setLoading(false);
    }
  }

  function renderResult(r) {
    document.getElementById("titulo").textContent = r.titulo_optimizado || "";
    document.getElementById("char-titulo").textContent = r.caracteres_titulo + " chars";

    const ul = document.getElementById("bullets");
    ul.innerHTML = "";
    (r.bullet_points || []).forEach(b => {
      const li = document.createElement("li");
      li.textContent = b;
      ul.appendChild(li);
    });

    document.getElementById("descripcion").textContent = r.descripcion_optimizada || "";
    document.getElementById("char-desc").textContent = r.caracteres_descripcion + " chars";

    const kwDiv = document.getElementById("keywords-out");
    kwDiv.innerHTML = "";
    (r.keywords_integradas || []).forEach(k => {
      const span = document.createElement("span");
      span.className = "kw-tag";
      span.textContent = k;
      kwDiv.appendChild(span);
    });

    document.getElementById("raw-json").textContent = JSON.stringify(r, null, 2);
    document.getElementById("result-section").style.display = "block";
    document.getElementById("result-section").scrollIntoView({ behavior: "smooth" });
  }

  function setLoading(on) {
    const btn = document.getElementById("generate-btn");
    const spinner = document.getElementById("spinner");
    const label = document.getElementById("btn-label");
    btn.disabled = on;
    spinner.style.display = on ? "block" : "none";
    label.textContent = on ? "Generando..." : "Generar Contenido Optimizado";
  }

  function toggleRaw() {
    const pre = document.getElementById("raw-json");
    pre.style.display = pre.style.display === "none" ? "block" : "none";
  }
</script>
</body>
</html>
